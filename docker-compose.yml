name: memorybook

services:
  # ParadeDB: PostgreSQL with built-in pg_search extension for BM25 vectorless RAG search
  paradedb:
    image: paradedb/paradedb:latest
    container_name: memorybook_paradedb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: memorybook_db
    volumes:
      - paradedb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memorybook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neo4j: Graph Database for Entity, Knowledge Graph, Temporal and Procedural memory
  neo4j:
    image: neo4j:5.26-community
    container_name: memorybook_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol Port
    environment:
      - NEO4J_AUTH=neo4j/memorybook_graph_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Inngest: self-hosted OSS durable execution engine for all background
  # pipelines (source ingestion, knowledge-graph extraction, memory
  # extraction). Backed by a dedicated `inngest` database on the same
  # ParadeDB Postgres instance (auto-created on server boot — see
  # ensureInngestDatabase() in server/src/db/index.ts) rather than the
  # default ephemeral SQLite, so pipeline state survives container restarts.
  # No Redis backing for now — single-node Postgres persistence is sufficient
  # at this app's scale; add `--redis-uri` later if horizontally scaling.
  inngest:
    image: inngest/inngest:latest
    container_name: memorybook_inngest
    restart: unless-stopped
    command:
      - "inngest"
      - "start"
      - "--postgres-uri"
      - "postgres://postgres:postgrespassword@paradedb:5432/inngest?sslmode=disable"
    ports:
      - "8288:8288" # Dashboard UI + Event API + Function registration
      - "8289:8289" # Connect WebSocket gateway
    environment:
      # Matches server/src/config/env.ts defaults for local development.
      # Set real, matching INNGEST_SIGNING_KEY/INNGEST_EVENT_KEY values here
      # and in server/.env (with INNGEST_DEV=false) for any non-local
      # deployment — dev mode (the default) disables signature verification.
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:-}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:-}
    depends_on:
      paradedb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8288/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  paradedb_data:
  neo4j_data:
